<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUMR — Visual Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f7f6f2;--text:#151513;--muted:#77766f;--line:#deddd6;--soft:#ebeae4}
[data-theme="dark"]{--bg:#10100f;--text:#f3f2ed;--muted:#9a9991;--line:#30302b;--soft:#24241f}
html,body{min-height:100%;background:var(--bg)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text)}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
.app{width:100%;max-width:1500px;min-height:100dvh;margin:auto;background:var(--bg)}
.header{height:76px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:15;background:var(--bg)}
.header h1{font-family:Georgia,serif;font-size:18px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.menu{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;gap:3px;padding:9px}
.menu span{display:block;width:14px;height:1px;background:var(--text)}.menu span:nth-child(2){width:9px;margin-left:-5px}.ph{width:36px}
.tabs{display:flex;gap:24px;padding:26px 34px 14px;border-bottom:1px solid var(--line);overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);white-space:nowrap;padding-bottom:9px;position:relative}.tab.active{color:var(--text)}.tab.active:after{content:"";position:absolute;bottom:-15px;left:0;right:0;height:1px;background:var(--text)}
.grid{padding:22px 26px 100px;display:block;columns:4 240px;column-gap:12px;overflow:visible}
.gi{width:100%;height:auto;aspect-ratio:auto;display:block;break-inside:avoid;margin:0 0 12px;border-radius:0;overflow:hidden;background:var(--soft);position:relative;padding:0}
.gi img,.gi video{width:100%;height:auto;display:block;object-fit:cover}.gi video{min-height:120px}
.gi:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 70%,rgba(0,0,0,.3));opacity:0;transition:.2s;pointer-events:none}.gi:hover:after{opacity:1}
.vb{position:absolute;right:10px;bottom:10px;top:auto;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;display:grid;place-items:center;z-index:2}.vb svg{width:11px;height:11px}
.empty{column-span:all;text-align:center;padding:90px 20px;color:var(--muted);font-size:13px}.empty b{display:block;font-family:Georgia,serif;font-size:28px;color:var(--text);font-weight:400;margin-bottom:7px}
.bottom-nav{height:66px;position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(650px,100%);display:flex;justify-content:space-around;align-items:center;padding:0 10px env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line);z-index:18}
.nav-item{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:50%}.nav-item.active{color:var(--text)}.nav-item svg{width:20px;height:20px}
.fab{position:fixed;right:28px;bottom:88px;width:50px;height:50px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;z-index:19;box-shadow:0 8px 22px rgba(0,0,0,.2)}.fab svg{width:20px}
.profile-header{padding:34px 20px 12px;text-align:center}.avatar{width:92px;height:92px;border-radius:50%;margin:0 auto 15px;background:var(--soft) center/cover;display:grid;place-items:center;font-family:Georgia,serif;font-size:30px}.pname{font-family:Georgia,serif;font-size:28px;font-weight:400}.ploc{font-size:12px;color:var(--muted);margin:6px 0 18px}.stats{display:flex;justify-content:center;gap:34px}.stat-value{font-family:Georgia,serif;font-size:18px}.stat-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}.edit{margin-top:17px;border:1px solid var(--line);border-radius:99px;padding:8px 18px;font-size:11px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:50}.sheet-bg.on{display:flex}.sheet{width:100%;max-width:520px;margin:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:25px 20px calc(25px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}.sheet h2{font-family:Georgia,serif;font-weight:400;font-size:24px}.sheet input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:12px 13px;outline:none}.btn{background:var(--text);color:var(--bg);border-radius:11px;padding:12px;font-weight:600}.btn.ghost{background:transparent;color:var(--muted)}
#viewer{position:fixed;inset:0;background:#080808;z-index:80;display:none;flex-direction:column}#viewer.on{display:flex}#viewer .bar{height:70px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;color:#fff}#viewer .bar button{color:#fff}#viewer .bar svg{width:21px;height:21px}#stage{flex:1;min-height:0;display:grid;place-items:center;padding:10px 20px 35px}#stage img,#stage video{max-width:100%;max-height:100%;object-fit:contain}
#prog{position:fixed;top:0;left:0;height:2px;background:var(--text);width:0;z-index:100}
@media(max-width:900px){.grid{columns:3 210px}}@media(max-width:600px){.header{height:62px;padding:0 15px}.header h1{font-size:15px}.tabs{padding:20px 15px 12px;gap:20px}.tab.active:after{bottom:-13px}.grid{columns:2 140px;padding:10px 8px 88px;column-gap:7px}.gi{margin-bottom:7px}.gi:after{opacity:1}.vb{right:7px;bottom:7px}.bottom-nav{height:62px}.fab{right:16px;bottom:77px}.profile-header{padding-top:25px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="prog"></div>
  <div id="top"></div>
  <div id="content" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
  <div class="bottom-nav" id="nav"></div>

  <div class="sheet-bg" id="newCol"><div class="sheet">
    <h2>New collection</h2>
    <input type="text" id="colName" placeholder="e.g. Travel" maxlength="24">
    <button class="btn" id="colOk">Create</button><button class="btn ghost" data-close>Cancel</button>
  </div></div>

  <div class="sheet-bg" id="editP"><div class="sheet">
    <h2>Edit profile</h2>
    <label class="btn ghost" style="text-align:center;cursor:pointer">Change photo<input type="file" id="avIn" accept="image/*" hidden></label>
    <input type="text" id="pName" placeholder="Name" maxlength="40">
    <input type="text" id="pLoc" placeholder="Location" maxlength="40">
    <button class="btn" id="pOk">Save</button><button class="btn ghost" data-close>Cancel</button>
  </div></div>

  <div id="viewer"><div class="bar">
    <button id="vClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <span><button id="vFav" aria-label="Save" style="margin-right:20px"><svg id="favSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
    <button id="vDel" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button></span>
  </div><div id="stage"></div></div>
</div>
<input type="file" id="fileIn" accept="image/*,video/*" multiple hidden>

<script>
const $=id=>document.getElementById(id);
const IC={
 home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
 video:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z"/>',
 mark:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'};
const svg=(k,on)=>`<svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2">${IC[k]}</svg>`;

// ---------- Storage (originals saved as-is = full quality) ----------
let db;
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('moments-db',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('media',{keyPath:'id'});r.result.createObjectStore('meta')};
 r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)});
const st=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const pr=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const meta=k=>pr(st('meta').get(k));
const setMeta=(k,v)=>pr(st('meta','readwrite').put(v,k));

let items=[],cols=[],prof={name:'Your Name',loc:'',avatar:null},screen='home',tab='all',cur=null,urls=[];

async function init(){
 try{await open()}catch(e){$('content').innerHTML='<div class="empty"><b>Storage blocked</b>Open this file in a normal browser window.</div>';return}
 cols=(await meta('cols'))||[];
 prof={...prof,...((await meta('prof'))||{})};
 try{navigator.storage?.persist?.()}catch(e){}
 await load();
}
async function load(){items=(await pr(st('media').getAll())).sort((a,b)=>b.added-a.added);render()}

function render(){
 urls.forEach(URL.revokeObjectURL);urls=[];
 const titles={home:'Moments',videos:'Videos',saved:'Saved'};
 let list=items;
 if(screen==='videos')list=items.filter(i=>i.type==='video');
 if(screen==='saved')list=items.filter(i=>i.fav);
 if(screen==='home'&&tab!=='all')list=items.filter(i=>i.col===tab);

 $('top').innerHTML=screen==='profile'?'':
  `<div class="header"><div class="menu"><span></span><span></span><span></span></div><h1>${titles[screen]}</h1><div class="ph"></div></div>`;

 let h='';
 if(screen==='home'){
  h+=`<div class="tabs"><button class="tab ${tab==='all'?'active':''}" data-tab="all">All</button>`+
   cols.map(c=>`<button class="tab ${tab===c?'active':''}" data-tab="${esc(c)}">${esc(c)}</button>`).join('')+
   `<button class="tab" id="addCol">+ New</button></div>`;
 }
 if(screen==='profile'){
  const ph=items.filter(i=>i.type==='image').length;
  let av='';
  if(prof.avatar){const u=URL.createObjectURL(prof.avatar);urls.push(u);av=`style="background-image:url(${u})"`}
  h+=`<div class="profile-header"><div class="avatar" ${av}>${prof.avatar?'':esc((prof.name[0]||'?').toUpperCase())}</div>
   <div class="pname">${esc(prof.name)}</div><div class="ploc">${esc(prof.loc)}</div>
   <div class="stats"><div class="stat"><div class="stat-value">${items.length}</div><div class="stat-label">Posts</div></div>
   <div class="stat"><div class="stat-value">${ph}</div><div class="stat-label">Photos</div></div>
   <div class="stat"><div class="stat-value">${items.length-ph}</div><div class="stat-label">Videos</div></div></div>
   <button class="edit" id="editBtn">Edit profile</button></div>`;
  list=items;
 }
 h+='<div class="grid" id="grid"></div>';
 $('content').innerHTML=h;

 const g=$('grid');
 if(!list.length)g.innerHTML=`<div class="empty"><b>Nothing here yet</b>${screen==='saved'?'Tap the bookmark in any photo to save it.':'Tap + to add photos and videos.'}</div>`;
 list.forEach(it=>{
  const u=URL.createObjectURL(it.blob);urls.push(u);
  const b=document.createElement('button');b.className='gi';
  b.innerHTML=(it.type==='video'?`<video src="${u}#t=0.1" preload="metadata" muted playsinline></video><span class="vb"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></span>`:`<img src="${u}" loading="lazy" alt="">`);
  b.onclick=()=>view(it,u);g.appendChild(b);
 });

 $('nav').innerHTML=
  [['home','home'],['videos','video']].map(([s,i])=>`<button class="nav-item ${screen===s?'active':''}" data-s="${s}" aria-label="${s}">${svg(i,screen===s)}</button>`).join('')+
  `<button class="fab" id="fab" aria-label="Upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>`+
  [['saved','mark'],['profile','user']].map(([s,i])=>`<button class="nav-item ${screen===s?'active':''}" data-s="${s}" aria-label="${s}">${svg(i,screen===s)}</button>`).join('');
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- Events ----------
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab],[data-s],#addCol,#fab,#editBtn,[data-close]');
 if(!t)return;
 if(t.dataset.tab!==undefined){tab=t.dataset.tab;render()}
 else if(t.dataset.s){screen=t.dataset.s;render()}
 else if(t.id==='addCol'){$('colName').value='';$('newCol').classList.add('on');$('colName').focus()}
 else if(t.id==='fab')$('fileIn').click();
 else if(t.id==='editBtn'){$('pName').value=prof.name;$('pLoc').value=prof.loc;$('editP').classList.add('on')}
 else if(t.hasAttribute('data-close'))document.querySelectorAll('.sheet-bg').forEach(s=>s.classList.remove('on'));
});
$('colOk').onclick=async()=>{
 const n=$('colName').value.trim();
 if(n&&!cols.includes(n)){cols.push(n);await setMeta('cols',cols);tab=n;screen='home'}
 $('newCol').classList.remove('on');render();
};
$('pOk').onclick=async()=>{
 prof.name=$('pName').value.trim()||'Your Name';prof.loc=$('pLoc').value.trim();
 await setMeta('prof',prof);$('editP').classList.remove('on');render();
};
$('avIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;prof.avatar=f;await setMeta('prof',prof);render()};

$('fileIn').onchange=async e=>{
 const files=[...e.target.files].filter(f=>/^(image|video)\//.test(f.type));e.target.value='';
 for(let i=0;i<files.length;i++){
  const f=files[i];
  try{await pr(st('media','readwrite').put({id:crypto.randomUUID(),type:f.type.startsWith('video')?'video':'image',blob:f,added:Date.now()+i,fav:false,col:screen==='home'&&tab!=='all'?tab:null}))}
  catch(err){alert('Could not save '+f.name+'. Storage may be full.')}
  $('prog').style.width=((i+1)/files.length*100)+'%';
 }
 setTimeout(()=>$('prog').style.width='0',400);load();
};

// ---------- Viewer ----------
function view(it,u){
 cur=it;
 $('stage').innerHTML=it.type==='video'?`<video src="${u}" controls autoplay playsinline></video>`:`<img src="${u}" alt="">`;
 $('favSvg').setAttribute('fill',it.fav?'currentColor':'none');
 $('viewer').classList.add('on');
}
const closeV=()=>{$('stage').innerHTML='';$('viewer').classList.remove('on');cur=null};
$('vClose').onclick=closeV;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeV()});
$('vFav').onclick=async()=>{cur.fav=!cur.fav;await pr(st('media','readwrite').put(cur));$('favSvg').setAttribute('fill',cur.fav?'currentColor':'none')};
$('vDel').onclick=async()=>{
 if(!confirm('Delete this permanently?'))return;
 await pr(st('media','readwrite').delete(cur.id));closeV();load();
};
init();
</script>
</body>
</html>
